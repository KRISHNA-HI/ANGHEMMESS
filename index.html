    // Cryptographic Key Derivation using PBKDF2 (100,000 rounds) + AES-GCM 256
    async function deriveKey(password) {
      const encoder = new TextEncoder();
      const pwData = encoder.encode(password);
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        pwData,
        { name: "PBKDF2" },
        false,
        ["deriveBits", "deriveKey"]
      );
      const salt = encoder.encode("ANGHEMMESS_E2EE_PBKDF2_SALT_V1");
      return window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptText(text, key) {
      const encoder = new TextEncoder();
      const rawData = encoder.encode(text);
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const encryptedBuffer = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        rawData
      );
      const ciphertext = btoa(String.fromCharCode(...new Uint8Array(encryptedBuffer)));
      const ivBase64 = btoa(String.fromCharCode(...iv));
      return { ciphertext, iv: ivBase64 };
    }

    async function decryptText(ciphertext, ivStr, key) {
      try {
        const rawCiphertext = new Uint8Array(atob(ciphertext).split("").map(c => c.charCodeAt(0)));
        const rawIv = new Uint8Array(atob(ivStr).split("").map(c => c.charCodeAt(0)));
        const decryptedBuffer = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: rawIv },
          key,
          rawCiphertext
        );
        return new TextDecoder().decode(decryptedBuffer);
      } catch (err) {
        return "🔒 [Decryption Failed - Verification Incorrect]";
      }
    }

    const STORAGE_KEY_USER = "secure_chat_user_uid";
    const STORAGE_KEY_NAME = "secure_chat_user_name";
    const STORAGE_KEY_THEME = "secure_chat_pref_theme";

    const safeLocalStorage = {
      getItem: function(key) {
        try { return localStorage.getItem(key); } catch (e) { return this._fallback[key] || null; }
      },
      setItem: function(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
        this._fallback[key] = value;
      },
      removeItem: function(key) {
        try { localStorage.removeItem(key); } catch (e) {}
        delete this._fallback[key];
      },
      _fallback: {}
    };

    const safeSessionStorage = {
      getItem: function(key) {
        try { return sessionStorage.getItem(key); } catch (e) { return this._fallback[key] || null; }
      },
      setItem: function(key, value) {
        try { sessionStorage.setItem(key, value); } catch (e) {}
        this._fallback[key] = value;
      },
      removeItem: function(key) {
        try { sessionStorage.removeItem(key); } catch (e) {}
        delete this._fallback[key];

      _fallback: {}

    function showToast(message, type) {
      if (!type) { type = 'info'; }
      const duration = 2800;
      const toast = document.createElement('div');
      
      let baseClass = 'bg-zinc-900/90 text-white border-white/10 dark:bg-zinc-800/90';
      if (type === 'success') {
        baseClass = 'bg-emerald-600/90 text-white border-emerald-500/20';
      } else if (type === 'error') {
        baseClass = 'bg-rose-600/90 text-white border-rose-500/20';
      }
      
      toast.className = 'bubbly flex items-center gap-2 px-3.5 py-2.5 rounded-full shadow-xl border backdrop-blur-xl transition-all duration-300 transform pointer-events-auto ' + baseClass;
      
      const iconName = type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'info';
      toast.innerHTML = '<i data-lucide="' + iconName + '" class="w-4 h-4 shrink-0"></i><span class="font-medium">' + message + '</span>';
      toastNotificationBox.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-6px)';
        setTimeout(() => toast.remove(), 250);
      }, duration);
    }

    function setConnState(state, message, showRetry = false) {
      connBar.classList.remove('hidden');
      connBar.classList.add('flex');
      const icon = document.getElementById('connIcon');
      const text = document.getElementById('connText');
      const retryBtn = document.getElementById('connRetryBtn');
      
      if (state === 'online') {
        connBar.className = "fixed top-3 z-50 px-4 py-1.5 rounded-full text-xs font-medium flex items-center gap-2 shadow-lg backdrop-blur-xl border border-emerald-500/30 bg-emerald-600/80 text-white select-none";
        icon.setAttribute('data-lucide', 'shield-check');
        text.innerText = message || "Connected to Firebase";
        if (retryBtn) retryBtn.classList.add('hidden');
        setTimeout(() => {
          if (db && !db.mockMode) connBar.classList.add('hidden');
        }, 3000);
      } else if (state === 'mock') {
        connBar.className = "fixed top-3 z-50 px-4 py-1.5 rounded-full text-xs font-medium flex items-center gap-2 shadow-lg backdrop-blur-xl border border-amber-500/30 bg-amber-600/80 text-white select-none";
        icon.setAttribute('data-lucide', 'info');
        text.innerText = message || "Local Encrypted Sandbox Mode";
        if (retryBtn) {
          retryBtn.classList.remove('hidden');
          retryBtn.innerText = "Connect Cloud";
        }
      } else if (state === 'error') {
        connBar.className = "fixed top-3 z-50 px-4 py-1.5 rounded-full text-xs font-medium flex items-center gap-2 shadow-lg backdrop-blur-xl border border-rose-500/30 bg-rose-600/80 text-white select-none";
        icon.setAttribute('data-lucide', 'alert-circle');
        text.innerText = message || "Connection Error";
        if (retryBtn) {
          retryBtn.classList.remove('hidden');
          retryBtn.innerText = "Retry";
        }
      } else if (state === 'connecting') {
        connBar.className = "fixed top-3 z-50 px-4 py-1.5 rounded-full text-xs font-medium flex items-center gap-2 shadow-lg backdrop-blur-xl border border-blue-500/30 bg-blue-600/80 text-white select-none";
        icon.setAttribute('data-lucide', 'loader-2');
        text.innerText = message || "Connecting...";
        if (retryBtn) retryBtn.classList.add('hidden');
      }
      lucide.createIcons();
    }

    document.getElementById('connRetryBtn').addEventListener('click', () => {
      tryInitializeFirebase();
    });

    function tryInitializeFirebase() {
      setConnState('connecting', 'Connecting...');
      
      const hasValidApiKey = firebaseConfig.apiKey && 
                             firebaseConfig.apiKey.startsWith('AIza') && 
                             firebaseConfig.apiKey.length >= 30;
      const hasPlaceholderDomain = !firebaseConfig.authDomain || 
                                   firebaseConfig.authDomain.includes('YOUR_PROJECT_ID');

      if (!hasValidApiKey || hasPlaceholderDomain) {
        console.warn("[ANGHEMMESS] Firebase API key or authDomain is placeholder. Operating in Local Encrypted Sandbox Mode.");
        setupLocalMockDatabase("Local Sandbox Active (E2EE)");
        return;
      }
      
      try {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        
        try {
          const auth = getAuth(app);
          signInAnonymously(auth)
            .then((userCredential) => {
              myUid = userCredential.user.uid;
              safeSessionStorage.setItem(STORAGE_KEY_USER, myUid);
              setConnState('online', 'Connected & Authenticated');
              showToast("Connected securely", "success");
              if (currentRoomCode) {
                setPresenceOnline();
              }
            })
            .catch((authError) => {
              console.error("[ANGHEMMESS] Firebase Authentication failed:", authError.code, authError.message);
              setConnState('mock', "Local Sandbox (Auth unconfigured)", true);
              setupLocalMockDatabase("Local Sandbox Active");
            });
        } catch (authInitErr) {
          setupLocalMockDatabase("Local Sandbox Active");
        }
        
        connectedRef = ref(db, ".info/connected");
        onValue(connectedRef, (snap) => {
          if (snap.val() === true) {
            setConnState('online', 'Connected');
            if (currentRoomCode) {
              setPresenceOnline();
            }
          } else {
            setConnState('connecting', 'Reconnecting...');
          }
        });
      } catch (err) {
        console.error("[ANGHEMMESS] Firebase init failed: ", err);
        setupLocalMockDatabase("Local Sandbox Active");
      }
    }

    let mockSubscriptions = {};
    function setupLocalMockDatabase(statusMessage) {
      db = {
        mockMode: true,
        getRef: function(pathStr) {
          return pathStr;
        }
      };
      
      setConnState('mock', statusMessage || "Local Sandbox Active", true);

      if (!localStorage.getItem('local_simulation_rooms')) {
        localStorage.setItem('local_simulation_rooms', JSON.stringify({}));
      }

      if (window.mockIntervalId) clearInterval(window.mockIntervalId);
      window.mockIntervalId = setInterval(() => {
        if (currentRoomCode) {
          triggerMockLocalOnValue(currentRoomCode);
        }
      }, 700);
    }

    function triggerMockLocalOnValue(roomCode) {
      const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
      const room = allRooms[roomCode];
      if (!room) return;

      if (mockSubscriptions[roomCode + '/messages']) {
        mockSubscriptions[roomCode + '/messages'](room.messages || {});
      }
      if (mockSubscriptions[roomCode + '/users']) {
        const adjustedOnlineUsers = { ...room.users };
        mockSubscriptions[roomCode + '/users'](adjustedOnlineUsers);
      }
      if (mockSubscriptions[roomCode + '/metadata']) {
        mockSubscriptions[roomCode + '/metadata'](room.metadata || {});
      }
    }

    function validateAndGetUser() {
      clearInlineErrors();
      const name = usernameInput.value.trim();
      if (!name) {
        showInlineError('usernameError', 'Please enter a nickname (1-25 characters)');
        showToast("Enter a nickname to proceed", "error");
        usernameInput.focus();
        return null;
      }
      currentUsername = name;
      if (rememberMeInput.checked) {
        safeLocalStorage.setItem(STORAGE_KEY_NAME, name);
      } else {
        safeLocalStorage.removeItem(STORAGE_KEY_NAME);
      }
      return name;
    }

    // CREATE ROOM ACTION
    document.getElementById('btnConfirmCreate').addEventListener('click', async () => {
      const name = validateAndGetUser();
      if (!name) return;

      const passwordInput = document.getElementById('createRoomPasswordInput');
      const passwordText = passwordInput.value;
      if (!passwordText || passwordText.length < 6) {
        showInlineError('createPasswordError', 'Password must be at least 6 characters');
        showToast("Password must be at least 6 characters", "error");
        passwordInput.focus();
        return;
      }

      const code = 'R-' + Math.floor(1000 + Math.random() * 9000);
      currentRoomCode = code;
      isCreator = true;

      try {
        activeE2eeKey = await deriveKey(passwordText);
        const verification = await encryptText("VERIFY_ROOM_" + code, activeE2eeKey);
        initializeRoomOnDatabase(code, name, verification.ciphertext, verification.iv);
      } catch (err) {
        showToast("Key derivation failed", "error");
        console.error(err);
      }
    });

    // JOIN ROOM ACTION
    document.getElementById('btnConfirmJoin').addEventListener('click', async () => {
      const name = validateAndGetUser();
      if (!name) return;

      const inputCode = roomCodeInput.value.trim().toUpperCase();
      if (!inputCode || inputCode.length < 4) {
        showInlineError('roomCodeError', 'Enter a valid room code (e.g. R-1234)');
        showToast("Enter a valid room code", "error");
        roomCodeInput.focus();
        return;
      }

      const joinPasswordInput = document.getElementById('joinRoomPasswordInput');
      const enteredPasswordText = joinPasswordInput.value;
      if (!enteredPasswordText || enteredPasswordText.length < 6) {
        showInlineError('joinPasswordError', 'Enter room password (at least 6 characters)');
        showToast("Enter the room password", "error");

      currentRoomCode = inputCode;
      isCreator = false;

    function initializeRoomOnDatabase(roomCode, creatorName, verificationCipher, verificationIv) {
      if (db.mockMode) {
        const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
        allRooms[roomCode] = {
          metadata: {
            createdBy: myUid,
            createdAt: Date.now(),
            roomCode: roomCode,
            verificationCipher: verificationCipher,
            verificationIv: verificationIv
          },
          messages: {},
          users: {
            [myUid]: {
              username: creatorName,
              lastActive: Date.now(),
              isTyping: false
            }
          }
        };
        localStorage.setItem('local_simulation_rooms', JSON.stringify(allRooms));
        enterMainChatModule(roomCode, creatorName);
      } else {
        const metadata = {
          createdBy: myUid,
          createdAt: serverTimestamp(),
          roomCode: roomCode,
          verificationCipher: verificationCipher,
          verificationIv: verificationIv
        };

        set(ref(db, 'rooms/' + roomCode + '/metadata'), metadata)
          .then(() => {
            enterMainChatModule(roomCode, creatorName);
          })
          .catch(err => {
            console.error(err);
            setupLocalMockDatabase("Local Sandbox Active");
            initializeRoomOnDatabase(roomCode, creatorName, verificationCipher, verificationIv);
          });
      }
    }

    function joinRoomOnDatabase(roomCode, userName, passwordText) {
      if (db.mockMode) {
        const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
        const targetRoom = allRooms[roomCode];
        if (!targetRoom) {
          showInlineError('roomCodeError', 'Room not found or expired');
          showToast("Room not found", "error");
          return;
        }

        const meta = targetRoom.metadata || {};
        if (meta.verificationCipher && meta.verificationIv) {
          deriveKey(passwordText).then(potentialKey => {
            decryptText(meta.verificationCipher, meta.verificationIv, potentialKey).then(decrypted => {
              if (decrypted !== "VERIFY_ROOM_" + roomCode) {
                showInlineError('joinPasswordError', 'Incorrect password');
                showToast("Incorrect password", "error");
                return;
              }
              activeE2eeKey = potentialKey;
              targetRoom.users[myUid] = {
                username: userName,
                lastActive: Date.now(),
                isTyping: false
              };
              localStorage.setItem('local_simulation_rooms', JSON.stringify(allRooms));
              enterMainChatModule(roomCode, userName);
              showToast("Joined room", "success");
            });
          }).catch(err => {
            showToast("Password verification failed", "error");
          });
        } else {
          enterMainChatModule(roomCode, userName);
        }
      } else {
        const metaRef = ref(db, 'rooms/' + roomCode + '/metadata');
        onValue(metaRef, async (snapshot) => {
          const val = snapshot.val();
          if (!val) {
            showInlineError('roomCodeError', 'Room not found or expired');
            showToast("Room not found", "error");
            return;
          }

          if (val.verificationCipher && val.verificationIv) {
            try {
              const potentialKey = await deriveKey(passwordText);
              const decrypted = await decryptText(val.verificationCipher, val.verificationIv, potentialKey);
              if (decrypted !== "VERIFY_ROOM_" + roomCode) {
                showInlineError('joinPasswordError', 'Incorrect room password');
                showToast("Incorrect room password", "error");
                return;
              }
              activeE2eeKey = potentialKey;
            } catch (err) {
              showToast("Verification failed", "error");
              return;
            }
          }

          isCreator = val.createdBy === myUid;
          enterMainChatModule(roomCode, userName);
        }, { onlyOnce: true });
      }
    }

    function enterMainChatModule(roomCode, username) {
      displayRoomCode.innerText = roomCode;
      loginScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      document.getElementById('leaveRoomActionBtn').classList.remove('hidden');

      if (isCreator && settings.enableClearChat) {
        creatorActionMenu.classList.remove('hidden');
      } else {
        creatorActionMenu.classList.add('hidden');
      }

      setupPresenceAndListeners(roomCode, username);
      setTimeout(() => {
        messageTextBox.focus();
      }, 150);
    }

    function setupPresenceAndListeners(roomCode, username) {
      if (db.mockMode) {
        mockSubscriptions[roomCode + '/messages'] = (messagesSnap) => {
          renderMessagesList(messagesSnap);
        };
        mockSubscriptions[roomCode + '/users'] = (usersSnap) => {
          renderOnlineUsersList(usersSnap);
        };
        mockSubscriptions[roomCode + '/metadata'] = (metadataSnap) => {
          if (!metadataSnap || !metadataSnap.createdAt) {
            handleCreatorExpiredRoom();
          }
        };
        triggerMockLocalOnValue(roomCode);
      } else {
        userPresenceRef = ref(db, 'rooms/' + roomCode + '/users/' + myUid);
        set(userPresenceRef, {
          username: username,
          lastActive: serverTimestamp(),
          isTyping: false
        });

        setPresenceOnline();

        const messagesRef = ref(db, 'rooms/' + roomCode + '/messages');
        onValue(messagesRef, (snap) => {
          renderMessagesList(snap.val() || {});
        });

        const usersRef = ref(db, 'rooms/' + roomCode + '/users');
        onValue(usersRef, (snap) => {
          renderOnlineUsersList(snap.val() || {});
        });

        const metadataRef = ref(db, 'rooms/' + roomCode + '/metadata');
        onValue(metadataRef, (snap) => {
          const val = snap.val();
          if (!val || !val.createdAt) {
            handleCreatorExpiredRoom();
          }
        });
      }
    }

    function setPresenceOnline() {
      if (db.mockMode || !userPresenceRef) return;
      update(userPresenceRef, {
        lastActive: serverTimestamp()
      });
    }

    function renderOnlineUsersList(usersObj) {
      const activeUids = Object.keys(usersObj);
      const onlineCount = activeUids.length;
      userCountIndicator.innerText = onlineCount + (onlineCount === 1 ? " online" : " online");

      const typingUsers = [];
      activeUids.forEach(uid => {
        if (uid !== myUid && usersObj[uid].isTyping === true) {
          typingUsers.push(usersObj[uid].username);
        }
      });

      if (typingUsers.length > 0) {
        const names = typingUsers.join(', ');
        typingIndicatorBox.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>' +
          '<span class="font-medium">' + names + ' is typing...</span>';
      } else {
        typingIndicatorBox.innerHTML = '';
      }
    }

    async function renderMessagesList(messagesObj) {
      messagesList.innerHTML = '';
      const ids = Object.keys(messagesObj);
      
      if (ids.length === 0) {
        messagesList.innerHTML = '<div class="flex flex-col items-center justify-center py-16 text-center text-zinc-400 dark:text-zinc-600 select-none">' +
          '<div class="w-12 h-12 rounded-full bg-zinc-100 dark:bg-zinc-800/50 flex items-center justify-center mb-3">' +
            '<i data-lucide="message-square" class="w-6 h-6 stroke-1"></i>' +
          '</div>' +
          '<span class="text-xs font-medium">Say hello to start the conversation</span>' +
        '</div>';
        lucide.createIcons();
        return;
      }

      const listData = ids.map(id => ({
        idKey: id,
        sender: messagesObj[id].sender || 'Anonymous',
        ciphertext: messagesObj[id].ciphertext || '',
        iv: messagesObj[id].iv || '',
        text: messagesObj[id].text || '',
        timestamp: messagesObj[id].timestamp || Date.now(),
        localTimestamp: messagesObj[id].localTimestamp,
        uid: messagesObj[id].uid || ''
      }));

      const decryptedMessages = await Promise.all(listData.map(async msg => {
        if (msg.ciphertext && msg.iv) {
          if (!activeE2eeKey) {
            msg.text = "🔒 [Message locked]";
          } else {
            msg.text = await decryptText(msg.ciphertext, msg.iv, activeE2eeKey);
          }
        }
        return msg;
      }));

      const sortedMessages = decryptedMessages.sort((a, b) => {
        const tA = typeof a.timestamp === 'number' ? a.timestamp : (a.localTimestamp || Date.now());
        const tB = typeof b.timestamp === 'number' ? b.timestamp : (b.localTimestamp || Date.now());
        return tA - tB;
      });

      sortedMessages.forEach(msg => {
        const isMe = msg.uid === myUid;
        const msgTimeVal = typeof msg.timestamp === 'number' ? msg.timestamp : (msg.localTimestamp || Date.now());
        const msgTime = new Date(msgTimeVal).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const card = document.createElement('div');
        card.className = "flex flex-col w-full " + (isMe ? "items-end" : "items-start");

        let deleteBtnHtml = '';
        if (isMe && settings.enableDeletion) {
          deleteBtnHtml = '<button class="delete-msg-btn text-[9px] text-zinc-400 hover:text-rose-500 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-opacity cursor-pointer p-0.5" data-id="' + msg.idKey + '" title="Delete Message" aria-label="Delete Message">' +
            '<i data-lucide="trash" class="w-3 h-3"></i>' +
          '</button>';
        }

        let senderHtml = '';
        if (!isMe) {
          senderHtml = '<span class="text-[10.5px] font-semibold text-emerald-600 dark:text-emerald-400 ml-2 mb-1 select-none">' + escapeHtml(msg.sender) + '</span>';
        }

        const bubbleClass = isMe 
          ? 'bg-emerald-600 text-white rounded-2xl rounded-tr-xs shadow-sm shadow-emerald-600/10' 
          : 'bg-white/95 dark:bg-zinc-800/95 text-zinc-900 dark:text-zinc-100 border border-black/[0.04] dark:border-white/[0.06] rounded-2xl rounded-tl-xs shadow-xs';

        card.innerHTML = '<div class="max-w-[82%] flex flex-col group">' +
          senderHtml +
          '<div class="px-4 py-2.5 text-xs sm:text-[13px] leading-relaxed break-words relative transition-all ' + bubbleClass + '">' +
            '<div class="select-text font-normal whitespace-pre-wrap">' + escapeHtml(msg.text) + '</div>' +
            '<div class="flex items-center justify-end gap-1 text-[8.5px] mt-1 opacity-70 select-none">' +
              '<span>' + msgTime + '</span>' +
              deleteBtnHtml +
            '</div>' +
          '</div>' +
        '</div>';

        messagesList.appendChild(card);
      });

      document.querySelectorAll('.delete-msg-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const msgId = btn.getAttribute('data-id');
          if (msgId) {
            triggerDeleteMessage(msgId);
          }
        });
      });

      lucide.createIcons();
      scrollToLatest();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function scrollToLatest() {
      const bottom = document.getElementById('bottomAnchor');
      if (bottom) {
        bottom.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function triggerSendMessage() {
      const text = messageTextBox.value.trim();
      if (!text) return;

      const now = Date.now();
      if (now - lastSentMessageTime < settings.rateLimitMs) {
        return;
      }

      if (text.length > settings.maxMessageLength) {
        showToast("Message exceeds length limit", "error");
        return;
      }

      lastSentMessageTime = now;
      messageTextBox.value = '';
      setSelfTyping(false);
      
      postNewMessage(currentRoomCode, text);
    }

    async function postNewMessage(roomCode, messageText) {
      if (!activeE2eeKey) {
        showToast("Encryption key inactive", "error");
        return;
      }
      try {
        const encrypted = await encryptText(messageText, activeE2eeKey);
        const messagePayload = {
          sender: currentUsername,
          text: "[Encrypted Message]",
          ciphertext: encrypted.ciphertext,
          iv: encrypted.iv,
          timestamp: Date.now(),
          localTimestamp: Date.now(),
          uid: myUid
        };

        if (db.mockMode) {
          const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
          const room = allRooms[roomCode];
          if (room) {
            const fakeMsgId = 'm-' + Math.random().toString(36).substring(2, 11);
            if (!room.messages) room.messages = {};
            room.messages[fakeMsgId] = messagePayload;
            localStorage.setItem('local_simulation_rooms', JSON.stringify(allRooms));
            triggerMockLocalOnValue(roomCode);
          }
        } else {
          const msgListRef = ref(db, 'rooms/' + roomCode + '/messages');
          const nextMessageRef = push(msgListRef);
          set(nextMessageRef, messagePayload)
            .catch(err => {
              setupLocalMockDatabase("Local Sandbox Active");
              postNewMessage(roomCode, messageText);
            });
        }
      } catch (err) {
        showToast("Encryption failed", "error");
        console.error(err);
      }
    }

    function triggerDeleteMessage(msgId) {
      if (db.mockMode) {
        const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
        const room = allRooms[currentRoomCode];
        if (room && room.messages && room.messages[msgId]) {
          delete room.messages[msgId];
          localStorage.setItem('local_simulation_rooms', JSON.stringify(allRooms));
          triggerMockLocalOnValue(currentRoomCode);
          showToast("Message deleted", "info");
        }
      } else {
        const targetMsgRef = ref(db, 'rooms/' + currentRoomCode + '/messages/' + msgId);
        remove(targetMsgRef)
          .then(() => showToast("Message deleted", "info"))
          .catch(err => showToast("Deletion failed", "error"));
      }
    }

    function handleTypingEvent() {
      setSelfTyping(true);
      if (typingDebounceTimeout) clearTimeout(typingDebounceTimeout);
      typingDebounceTimeout = setTimeout(() => {
        setSelfTyping(false);
      }, 2000);
    }

    function setSelfTyping(typingBool) {
      if (db.mockMode) {
        const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
        const room = allRooms[currentRoomCode];
        if (room && room.users[myUid]) {
          room.users[myUid].isTyping = typingBool;
          localStorage.setItem('local_simulation_rooms', JSON.stringify(allRooms));
        }
      } else if (userPresenceRef) {
        update(userPresenceRef, {
          isTyping: typingBool
        });
      }
    }

    function triggerLeaveRoom() {
      if (!confirm("Exit this private chat?")) {
        return;
      }
      cleanupActivePresenceAndViews();
    }

    function cleanupActivePresenceAndViews() {
      if (currentRoomCode) {
        setSelfTyping(false);
        if (!db.mockMode) {
          off(ref(db, 'rooms/' + currentRoomCode + '/messages'));
          off(ref(db, 'rooms/' + currentRoomCode + '/users'));
          off(ref(db, 'rooms/' + currentRoomCode + '/metadata'));

          if (userPresenceRef) {
            remove(userPresenceRef);
          }
        }
      }

      currentRoomCode = '';
      isCreator = false;
      chatScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      document.getElementById('leaveRoomActionBtn').classList.add('hidden');
      creatorActionMenu.classList.add('hidden');
      creatorMenuOverlay.classList.add('hidden');
      triggerView('welcome');
      showToast("Left room", "info");
    }

    function handleCreatorExpiredRoom() {
      showToast("Room closed by creator", "info");
      cleanupActivePresenceAndViews();
    }

    // Creator Actions
    creatorActionMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      creatorMenuOverlay.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      creatorMenuOverlay.classList.add('hidden');
    });

    creatorMenuOverlay.addEventListener('click', e => e.stopPropagation());

    document.getElementById('btnClearAllMessages').addEventListener('click', () => {
      if (!confirm("Clear all messages in this room?")) {
        return;
      }
      creatorMenuOverlay.classList.add('hidden');

      if (db.mockMode) {
        const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
        const room = allRooms[currentRoomCode];
        if (room) {
          room.messages = {};
          localStorage.setItem('local_simulation_rooms', JSON.stringify(allRooms));
          triggerMockLocalOnValue(currentRoomCode);
          showToast("Chat cleared", "info");
        }
      } else {
        const msgsRef = ref(db, 'rooms/' + currentRoomCode + '/messages');
        remove(msgsRef)
          .then(() => showToast("Chat cleared", "info"))
          .catch(() => showToast("Operation denied", "error"));
      }
    });

    document.getElementById('btnExpireRoom').addEventListener('click', () => {
      if (!confirm("Expire room permanently?")) {
        return;
      }
      creatorMenuOverlay.classList.add('hidden');

      if (db.mockMode) {
        const allRooms = JSON.parse(localStorage.getItem('local_simulation_rooms') || '{}');
        delete allRooms[currentRoomCode];
        localStorage.setItem('local_simulation_rooms', JSON.stringify(allRooms));
        showToast("Room expired", "info");
        cleanupActivePresenceAndViews();
      } else {
        const roomWholeRef = ref(db, 'rooms/' + currentRoomCode);
        remove(roomWholeRef)
          .then(() => {
            showToast("Room expired", "info");
            cleanupActivePresenceAndViews();
          })
          .catch(() => showToast("Operation denied", "error"));
      }
    });

    // Input handlers
    messageTextBox.addEventListener('input', () => {
      handleTypingEvent();
    });

    messageTextBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        triggerSendMessage();
      }
    });

    sendMessageBtn.addEventListener('click', triggerSendMessage);

    // Share link
    document.getElementById('copyCodeBtn').addEventListener('click', () => {
      if (!currentRoomCode) return;
      const trackingUrl = window.location.origin + window.location.pathname + "?room=" + currentRoomCode;
      
      navigator.clipboard.writeText(trackingUrl)
        .then(() => {
          showToast("Invite link copied", "success");
        })
        .catch(() => {
          navigator.clipboard.writeText(currentRoomCode);
          showToast("Room code copied: " + currentRoomCode, "success");
        });
    });

    document.getElementById('leaveRoomActionBtn').addEventListener('click', triggerLeaveRoom);

    loadInitialSettings();
    tryInitializeFirebase();

  </script>
</body>
</html>
